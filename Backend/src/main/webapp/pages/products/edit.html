<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Sản phẩm | CRM System</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/products.css">
</head>
<body>
    <main class="main-content">
        <div class="content-container">
            <div class="page-header">
                <h1 class="page-title">Cập nhật sản phẩm</h1>
                <a href="list.html" class="btn btn-secondary">Quay lại</a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <form id="editForm" action="/products/edit" method="POST">
                        <input type="hidden" name="productId" id="productId">
                        <div class="form-group">
                            <label>Mã SP (*)</label>
                            <input type="text" name="productCode" id="productCode" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Tên SP (*)</label>
                            <input type="text" name="productName" id="productName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Loại SP (*)</label>
                            <select name="productType" id="productType" class="form-control" required>
                                <option value="ONE_TIME">Sản phẩm (One-time)</option>
                                <option value="SUBSCRIPTION">Dịch vụ (Subscription)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Đơn vị tính (*)</label>
                            <input type="text" name="unit" id="unit" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Giá niêm yết (*)</label>
                            <input type="number" name="listPrice" id="listPrice" class="form-control" required min="0">
                        </div>
                        <div class="form-group">
                            <label>Giá sàn</label>
                            <input type="number" name="floorPrice" id="floorPrice" class="form-control" min="0">
                        </div>
                        <div class="form-group">
                            <label>Giá vốn</label>
                            <input type="number" name="costPrice" id="costPrice" class="form-control" min="0">
                        </div>
                        
                        <div class="form-actions mt-3">
                            <button type="submit" class="btn btn-primary">Cập nhật</button>
                        </div>
                        <div id="editMessage" class="toast-message mt-2" style="display: none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Load existing data
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('productId');
        if(productId) {
            document.getElementById('productId').value = productId;
            fetch(`/products/detail?productId=${productId}`)
                .then(res => res.json())
                .then(data => {
                    if(data.product) {
                        document.getElementById('productCode').value = data.product.productCode || '';
                        document.getElementById('productName').value = data.product.productName || '';
                        document.getElementById('productType').value = data.product.productType || 'ONE_TIME';
                        document.getElementById('unit').value = data.product.unit || '';
                        document.getElementById('listPrice').value = data.product.listPrice || '';
                        document.getElementById('floorPrice').value = data.product.floorPrice || '';
                        document.getElementById('costPrice').value = data.product.costPrice || '';
                    }
                }).catch(err => console.error(err));
        }

        // Submit edit
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('editMessage');
            messageDiv.style.display = 'block';
            
            const formData = new FormData(this);
            const urlEncodedData = new URLSearchParams(formData).toString();
            
            fetch(this.action, {
                method: this.method,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: urlEncodedData
            })
            .then(res => {
                if(!res.ok) throw new Error('API Error');
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    messageDiv.textContent = 'Cập nhật thành công!';
                    messageDiv.className = 'toast-message success';
                } else {
                    messageDiv.textContent = data.errors ? data.errors.join(', ') : 'Lỗi cập nhật.';
                    messageDiv.className = 'toast-message error';
                }
            })
            .catch(err => {
                messageDiv.textContent = 'Lỗi kết nối máy chủ.';
                messageDiv.className = 'toast-message error';
            });
        });
    </script>
</body>
</html>
