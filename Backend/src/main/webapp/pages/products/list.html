<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Sản phẩm | CRM System</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/products.css">
</head>
<body>
    <main class="main-content">
        <div class="content-container">
            <div class="page-header">
                <h1 class="page-title">Danh mục sản phẩm</h1>
                <a href="create.html" class="btn btn-primary">+ Tạo mới</a>
            </div>
            
            <div class="filter-section card">
                <div class="card-body">
                    <form id="filterForm">
                        <div class="form-row">
                            <input type="text" name="keyword" class="form-control" placeholder="Tìm kiếm theo mã, tên...">
                            <select name="productType" class="form-control">
                                <option value="">Tất cả loại</option>
                                <option value="ONE_TIME">Sản phẩm (One-time)</option>
                                <option value="SUBSCRIPTION">Dịch vụ (Subscription)</option>
                            </select>
                            <select name="status" class="form-control">
                                <option value="">Tất cả trạng thái</option>
                                <option value="ACTIVE">Hoạt động</option>
                                <option value="INACTIVE">Ngừng hoạt động</option>
                            </select>
                            <input type="hidden" name="page" value="1" id="pageInput">
                            <input type="hidden" name="pageSize" value="10">
                            <button type="submit" class="btn btn-secondary">Lọc</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="card">
                <div class="card-body table-container">
                    <table class="table" id="productTable">
                        <thead>
                            <tr>
                                <th>Mã SP</th>
                                <th>Tên SP</th>
                                <th>Loại</th>
                                <th>ĐVT</th>
                                <th>Giá niêm yết</th>
                                <th>Trạng thái</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data rendered via JS -->
                        </tbody>
                    </table>
                    <div id="pagination" class="pagination-wrapper"></div>
                    <div id="listMessage" class="toast-message" style="display: none;"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function loadProducts() {
            const formData = new FormData(document.getElementById('filterForm'));
            const params = new URLSearchParams(formData).toString();
            const messageDiv = document.getElementById('listMessage');
            
            fetch('/products?' + params)
                .then(res => {
                    if(!res.ok) throw new Error('API Error');
                    return res.json();
                })
                .then(data => {
                    const tbody = document.querySelector('#productTable tbody');
                    tbody.innerHTML = '';
                    if(data && data.products) {
                        data.products.forEach(p => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${p.productCode}</td>
                                <td>${p.productName}</td>
                                <td>${p.productType}</td>
                                <td>${p.unit}</td>
                                <td>${p.listPrice}</td>
                                <td>
                                    <button class="toggle-status badge ${p.status === 'ACTIVE' ? 'badge-success' : 'badge-warning'}" 
                                            data-id="${p.productId}" 
                                            data-status="${p.status}">
                                        ${p.status}
                                    </button>
                                </td>
                                <td>
                                    <a href="detail.html?productId=${p.productId}" class="btn-link">Chi tiết</a> | 
                                    <a href="edit.html?productId=${p.productId}" class="btn-link">Sửa</a>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                        
                        // Status toggle
                        document.querySelectorAll('.toggle-status').forEach(btn => {
                            btn.addEventListener('click', function() {
                                const id = this.getAttribute('data-id');
                                const currentStatus = this.getAttribute('data-status');
                                const newStatus = currentStatus === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';
                                
                                const bodyData = new URLSearchParams();
                                bodyData.append('productId', id);
                                bodyData.append('status', newStatus);
                                
                                fetch('/products/status', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                                    body: bodyData.toString()
                                })
                                .then(res => res.json())
                                .then(resData => {
                                    if(resData.success) {
                                        this.setAttribute('data-status', newStatus);
                                        this.textContent = newStatus;
                                        this.className = `toggle-status badge ${newStatus === 'ACTIVE' ? 'badge-success' : 'badge-warning'}`;
                                    } else {
                                        alert('Lỗi cập nhật trạng thái');
                                    }
                                }).catch(() => alert('Lỗi hệ thống'));
                            });
                        });
                    }
                })
                .catch(err => {
                    messageDiv.textContent = 'Không thể tải danh sách sản phẩm.';
                    messageDiv.className = 'toast-message error';
                    messageDiv.style.display = 'block';
                });
        }
        
        document.getElementById('filterForm').addEventListener('submit', e => {
            e.preventDefault();
            document.getElementById('pageInput').value = 1;
            loadProducts();
        });
        
        // Initial load simulation (if API was real)
        // loadProducts();
    </script>
</body>
</html>
