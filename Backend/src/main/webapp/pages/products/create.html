<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Sản phẩm | CRM System</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/products.css">
</head>
<body>
    <main class="main-content">
        <div class="content-container">
            <div class="page-header">
                <h1 class="page-title">Tạo mới sản phẩm</h1>
                <a href="list.html" class="btn btn-secondary">Quay lại</a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <form id="createForm" action="/products/create" method="POST">
                        <div class="form-group">
                            <label>Mã SP (*)</label>
                            <input type="text" name="productCode" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Tên SP (*)</label>
                            <input type="text" name="productName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Loại SP (*)</label>
                            <select name="productType" class="form-control" required>
                                <option value="ONE_TIME">Sản phẩm (One-time)</option>
                                <option value="SUBSCRIPTION">Dịch vụ (Subscription)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Đơn vị tính (*)</label>
                            <input type="text" name="unit" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Giá niêm yết (*)</label>
                            <input type="number" name="listPrice" class="form-control" required min="0">
                        </div>
                        <div class="form-group">
                            <label>Giá sàn</label>
                            <input type="number" name="floorPrice" class="form-control" min="0">
                        </div>
                        <div class="form-group">
                            <label>Giá vốn</label>
                            <input type="number" name="costPrice" class="form-control" min="0">
                        </div>
                        
                        <div class="form-actions mt-3">
                            <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
                        </div>
                        <div id="createMessage" class="toast-message mt-2" style="display: none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('createForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('createMessage');
            messageDiv.style.display = 'block';
            
            const formData = new FormData(this);
            // Validation example
            const listPrice = parseFloat(formData.get('listPrice'));
            if(isNaN(listPrice) || listPrice < 0) {
                messageDiv.textContent = 'Giá niêm yết không hợp lệ.';
                messageDiv.className = 'toast-message error';
                return;
            }
            
            // convert formData to urlencoded for standard form POST if needed, but the prompt says just Request Parameters. 
            // We use urlencoded to match typical API if not multipart
            const urlEncodedData = new URLSearchParams(formData).toString();
            
            fetch(this.action, {
                method: this.method,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: urlEncodedData
            })
            .then(res => {
                if(!res.ok) throw new Error('API Error');
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    messageDiv.textContent = 'Tạo mới thành công!';
                    messageDiv.className = 'toast-message success';
                    this.reset();
                } else {
                    messageDiv.textContent = data.errors ? data.errors.join(', ') : 'Lỗi tạo mới.';
                    messageDiv.className = 'toast-message error';
                }
            })
            .catch(err => {
                messageDiv.textContent = 'Lỗi kết nối máy chủ.';
                messageDiv.className = 'toast-message error';
            });
        });
    </script>
</body>
</html>
