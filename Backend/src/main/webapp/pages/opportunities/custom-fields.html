<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Custom Fields Cơ Hội</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/modules/opportunities.css">
</head>
<body>
    <div class="app">
        <main class="main-content">
            <h1>Quản lý Custom Fields (Cơ hội)</h1>
            
            <form id="customFieldForm" method="POST" action="/custom-fields">
                <input type="hidden" name="action" value="CREATE">
                <input type="hidden" name="entityType" value="OPPORTUNITY">
                <input type="hidden" name="customFieldId" value="">
                
                <div class="custom-field-form">
                    <label>Tên trường: <input type="text" name="fieldName" required></label>
                    <label>Loại: 
                        <select name="fieldType" required>
                            <option value="TEXT">TEXT</option>
                            <option value="NUMBER">NUMBER</option>
                            <option value="DATE">DATE</option>
                            <option value="SELECT">SELECT</option>
                        </select>
                    </label>
                    <label>Bắt buộc: <input type="checkbox" name="required" value="true"></label>
                    <label>Options (cho SELECT, cách nhau bằng phẩy): <input type="text" name="options"></label>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>

            <table class="opportunity-table">
                <thead>
                    <tr>
                        <th>Tên trường</th>
                        <th>Loại</th>
                        <th>Bắt buộc</th>
                        <th>Options</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="customFieldsTableBody">
                    <!-- Data will be loaded here via GET /custom-fields?entityType=OPPORTUNITY -->
                </tbody>
            </table>
        </main>
    </div>
</body>
</html>
