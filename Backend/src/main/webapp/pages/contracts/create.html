<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Hợp đồng | CRM System</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/contracts.css">
</head>
<body>
    <main class="main-content">
        <div class="content-container">
            <div class="page-header">
                <h1 class="page-title">Tạo mới Hợp đồng</h1>
                <a href="list.html" class="btn btn-secondary">Quay lại</a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <form id="createForm" action="/contracts/create" method="POST">
                        <div class="form-group">
                            <label>Mã hợp đồng (*)</label>
                            <input type="text" name="contractCode" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Tên hợp đồng (*)</label>
                            <input type="text" name="contractName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Giá trị hợp đồng (*)</label>
                            <input type="number" name="contractValue" class="form-control" required min="0">
                        </div>
                        <div class="form-group">
                            <label>Khách hàng liên quan (*)</label>
                            <input type="text" name="customerId" class="form-control" required placeholder="Mã Khách hàng">
                        </div>
                        <div class="form-group">
                            <label>Ngày bắt đầu (*)</label>
                            <input type="date" name="startDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Ngày kết thúc (*)</label>
                            <input type="date" name="endDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Trạng thái (*)</label>
                            <select name="status" class="form-control" required>
                                <option value="PENDING">Chờ duyệt</option>
                                <option value="ACTIVE">Đang hiệu lực</option>
                            </select>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Lưu hợp đồng</button>
                        </div>
                        <div id="createMessage" class="toast-message" style="display: none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('createForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('createMessage');
            messageDiv.style.display = 'block';
            
            const formData = new FormData(this);
            const value = parseFloat(formData.get('contractValue'));
            if(isNaN(value) || value < 0) {
                messageDiv.textContent = 'Giá trị hợp đồng không hợp lệ.';
                messageDiv.className = 'toast-message error';
                return;
            }
            
            const urlEncodedData = new URLSearchParams(formData).toString();
            
            fetch(this.action, {
                method: this.method,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: urlEncodedData
            })
            .then(res => {
                if(!res.ok) throw new Error('API Error');
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    messageDiv.textContent = 'Tạo hợp đồng thành công!';
                    messageDiv.className = 'toast-message success';
                    this.reset();
                } else {
                    messageDiv.textContent = data.errors ? data.errors.join(', ') : 'Lỗi tạo hợp đồng.';
                    messageDiv.className = 'toast-message error';
                }
            })
            .catch(err => {
                messageDiv.textContent = 'Lỗi kết nối máy chủ.';
                messageDiv.className = 'toast-message error';
            });
        });
    </script>
</body>
</html>
