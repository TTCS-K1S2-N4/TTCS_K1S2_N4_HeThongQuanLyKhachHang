<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Hợp đồng | CRM System</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/contracts.css">
</head>
<body>
    <main class="main-content">
        <div class="content-container">
            <div class="page-header">
                <h1 class="page-title">Cập nhật Hợp đồng</h1>
                <a href="list.html" class="btn btn-secondary">Quay lại</a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <form id="editForm" action="/contracts/edit" method="POST">
                        <input type="hidden" name="contractId" id="contractId">
                        <div class="form-group">
                            <label>Mã hợp đồng (*)</label>
                            <input type="text" name="contractCode" id="contractCode" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Tên hợp đồng (*)</label>
                            <input type="text" name="contractName" id="contractName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Giá trị hợp đồng (*)</label>
                            <input type="number" name="contractValue" id="contractValue" class="form-control" required min="0">
                        </div>
                        <div class="form-group">
                            <label>Khách hàng liên quan (*)</label>
                            <input type="text" name="customerId" id="customerId" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Ngày bắt đầu (*)</label>
                            <input type="date" name="startDate" id="startDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Ngày kết thúc (*)</label>
                            <input type="date" name="endDate" id="endDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Trạng thái (*)</label>
                            <select name="status" id="status" class="form-control" required>
                                <option value="PENDING">Chờ duyệt</option>
                                <option value="ACTIVE">Đang hiệu lực</option>
                                <option value="EXPIRED">Hết hạn</option>
                            </select>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                        </div>
                        <div id="editMessage" class="toast-message" style="display: none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const contractId = urlParams.get('id');
        
        if(contractId) {
            document.getElementById('contractId').value = contractId;
            fetch(`/contracts/detail?id=${contractId}`)
                .then(res => res.json())
                .then(data => {
                    if(data.contract) {
                        document.getElementById('contractCode').value = data.contract.contractCode || '';
                        document.getElementById('contractName').value = data.contract.contractName || '';
                        document.getElementById('contractValue').value = data.contract.contractValue || '';
                        document.getElementById('customerId').value = data.contract.customerId || '';
                        document.getElementById('startDate').value = data.contract.startDate || '';
                        document.getElementById('endDate').value = data.contract.endDate || '';
                        document.getElementById('status').value = data.contract.status || 'PENDING';
                    }
                }).catch(err => console.error(err));
        }

        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('editMessage');
            messageDiv.style.display = 'block';
            
            const formData = new FormData(this);
            const value = parseFloat(formData.get('contractValue'));
            if(isNaN(value) || value < 0) {
                messageDiv.textContent = 'Giá trị hợp đồng không hợp lệ.';
                messageDiv.className = 'toast-message error';
                return;
            }
            
            const urlEncodedData = new URLSearchParams(formData).toString();
            
            fetch(this.action, {
                method: this.method,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: urlEncodedData
            })
            .then(res => {
                if(!res.ok) throw new Error('API Error');
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    messageDiv.textContent = 'Cập nhật hợp đồng thành công!';
                    messageDiv.className = 'toast-message success';
                } else {
                    messageDiv.textContent = data.errors ? data.errors.join(', ') : 'Lỗi cập nhật hợp đồng.';
                    messageDiv.className = 'toast-message error';
                }
            })
            .catch(err => {
                messageDiv.textContent = 'Lỗi kết nối máy chủ.';
                messageDiv.className = 'toast-message error';
            });
        });
    </script>
</body>
</html>
