<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Hợp đồng | CRM System</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/contracts.css">
</head>
<body>
    <main class="main-content">
        <div class="content-container">
            <div class="page-header">
                <h1 class="page-title">Chi tiết hợp đồng</h1>
                <div>
                    <a href="edit.html" id="editLink" class="btn btn-primary">Sửa Hợp đồng</a>
                    <a href="list.html" class="btn btn-secondary">Quay lại</a>
                </div>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <table class="table detail-table">
                        <tbody>
                            <tr><th>Mã Hợp đồng:</th><td id="d-contractCode"></td></tr>
                            <tr><th>Tên Hợp đồng:</th><td id="d-contractName"></td></tr>
                            <tr><th>Giá trị Hợp đồng:</th><td id="d-contractValue"></td></tr>
                            <tr><th>Khách hàng liên quan:</th><td id="d-customerId"></td></tr>
                            <tr><th>Ngày bắt đầu:</th><td id="d-startDate"></td></tr>
                            <tr><th>Ngày kết thúc:</th><td id="d-endDate"></td></tr>
                            <tr><th>Trạng thái:</th><td id="d-status"></td></tr>
                        </tbody>
                    </table>
                    <div id="detailMessage" class="toast-message error" style="display: none;"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const contractId = urlParams.get('id');
        
        if(contractId) {
            document.getElementById('editLink').href = `edit.html?id=${contractId}`;
            
            fetch(`/contracts/detail?id=${contractId}`)
                .then(res => {
                    if(!res.ok) throw new Error('API Error');
                    return res.json();
                })
                .then(data => {
                    if(data.contract) {
                        document.getElementById('d-contractCode').textContent = data.contract.contractCode || '';
                        document.getElementById('d-contractName').textContent = data.contract.contractName || '';
                        document.getElementById('d-contractValue').textContent = data.contract.contractValue ? Number(data.contract.contractValue).toLocaleString() : '';
                        document.getElementById('d-customerId').textContent = data.contract.customerName || data.contract.customerId || '';
                        document.getElementById('d-startDate').textContent = data.contract.startDate || '';
                        document.getElementById('d-endDate').textContent = data.contract.endDate || '';
                        
                        const statusTd = document.getElementById('d-status');
                        const status = data.contract.status || '';
                        let badgeClass = 'badge-inactive';
                        if (status === 'ACTIVE') badgeClass = 'badge-active';
                        if (status === 'PENDING') badgeClass = 'badge-pending';
                        statusTd.innerHTML = `<span class="badge ${badgeClass}">${status}</span>`;
                    } else {
                        throw new Error('No contract data');
                    }
                })
                .catch(err => {
                    const msg = document.getElementById('detailMessage');
                    msg.textContent = 'Không thể tải chi tiết hợp đồng.';
                    msg.style.display = 'block';
                });
        }
    </script>
</body>
</html>
