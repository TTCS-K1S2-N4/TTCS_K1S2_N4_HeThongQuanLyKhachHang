<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết khách hàng | CRM System</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/customers.css">
</head>
<body>
    <main class="main-content">
        <div class="content-container">
            <!-- DRAFT S3-03 (trang 360): chưa nối API. Mỗi khối sẽ nhận dữ liệu từ BE khi có contract. -->
            <div class="page-header">
                <h1 class="page-title">Khách hàng 360</h1>
                <div>
                    <a href="edit.html" class="btn btn-primary">Sửa</a>
                    <a href="list.html" class="btn btn-secondary">Quay lại</a>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h2 class="cf-form-title">Thông tin công ty</h2>
                    <div class="kh-grid">
                        <div><strong>Tên công ty</strong><div id="infoName">-</div></div>
                        <div><strong>Mã số thuế</strong><div id="infoTax">-</div></div>
                        <div><strong>Ngành nghề</strong><div id="infoIndustry">-</div></div>
                        <div><strong>Trạng thái</strong><div id="infoStatus">-</div></div>
                        <div><strong>Giá trị đã ký</strong><div id="infoSigned">-</div></div>
                        <div><strong>Giá trị cơ hội đang mở</strong><div id="infoOpen">-</div></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h2 class="cf-form-title">Người liên hệ</h2>
                    <p class="cf-empty">Chưa có dữ liệu.</p>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h2 class="cf-form-title">Cơ hội (đang mở và đã đóng)</h2>
                    <p class="cf-empty">Chưa có dữ liệu.</p>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h2 class="cf-form-title">Dòng thời gian hoạt động</h2>
                    <p class="cf-empty">Chưa có dữ liệu.</p>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h2 class="cf-form-title">Tệp đính kèm</h2>
                    <p class="cf-empty">Chưa có dữ liệu.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
