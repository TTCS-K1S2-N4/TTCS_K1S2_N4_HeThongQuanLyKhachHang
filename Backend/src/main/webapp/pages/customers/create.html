<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo khách hàng | CRM System</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/customers.css">
</head>
<body>
    <main class="main-content">
        <div class="content-container">
            <!-- DRAFT S3-01: chưa nối API. Tên input là tạm theo backlog, chờ contract Sprint 3. -->
            <div class="page-header">
                <h1 class="page-title">Tạo mới khách hàng</h1>
                <a href="list.html" class="btn btn-secondary">Quay lại</a>
            </div>
            <div class="card">
                <div class="card-body">
                    <form id="createForm" action="#" method="POST">
                        <div class="form-group">
                            <label>Tên công ty (*)</label>
                            <input type="text" name="companyName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Mã số thuế</label>
                            <input type="text" name="taxCode" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Ngành nghề</label>
                            <input type="text" name="industry" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Quy mô</label>
                            <input type="text" name="size" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Website</label>
                            <input type="url" name="website" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Địa chỉ</label>
                            <input type="text" name="address" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Trạng thái</label>
                            <select name="status" class="form-control">
                                <option value="PROSPECT">Tiềm năng</option>
                                <option value="ACTIVE_DEAL">Đang giao dịch</option>
                                <option value="CUSTOMER">Khách hàng</option>
                                <option value="INACTIVE">Ngừng hợp tác</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Người sở hữu</label>
                            <input type="text" name="ownerId" class="form-control">
                        </div>
                        <div class="form-actions mt-3">
                            <button type="submit" class="btn btn-primary">Lưu khách hàng</button>
                        </div>
                        <div id="createMessage" class="toast-message" style="display: none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
