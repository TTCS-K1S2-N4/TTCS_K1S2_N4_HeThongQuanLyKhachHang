<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Sản phẩm | CRM System</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/products.css">
</head>
<body>
    <main class="main-content">
        <div class="content-container">
            <div class="page-header">
                <h1 class="page-title">Chi tiết sản phẩm</h1>
                <div>
                    <a href="edit.html" id="editLink" class="btn btn-primary">Sửa</a>
                    <a href="list.html" class="btn btn-secondary">Quay lại</a>
                </div>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <table class="table detail-table">
                        <tbody>
                            <tr><th>Mã SP:</th><td id="d-productCode"></td></tr>
                            <tr><th>Tên SP:</th><td id="d-productName"></td></tr>
                            <tr><th>Loại SP:</th><td id="d-productType"></td></tr>
                            <tr><th>Đơn vị tính:</th><td id="d-unit"></td></tr>
                            <tr><th>Giá niêm yết:</th><td id="d-listPrice"></td></tr>
                            <tr><th>Giá sàn:</th><td id="d-floorPrice"></td></tr>
                            <tr><th>Giá vốn:</th><td id="d-costPrice"></td></tr>
                            <tr><th>Trạng thái:</th><td id="d-status"></td></tr>
                        </tbody>
                    </table>
                    <div id="detailMessage" class="toast-message error" style="display: none;"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('productId');
        
        if(productId) {
            document.getElementById('editLink').href = `edit.html?productId=${productId}`;
            
            fetch(`/products/detail?productId=${productId}`)
                .then(res => {
                    if(!res.ok) throw new Error('API Error');
                    return res.json();
                })
                .then(data => {
                    if(data.product) {
                        document.getElementById('d-productCode').textContent = data.product.productCode || '';
                        document.getElementById('d-productName').textContent = data.product.productName || '';
                        document.getElementById('d-productType').textContent = data.product.productType || '';
                        document.getElementById('d-unit').textContent = data.product.unit || '';
                        document.getElementById('d-listPrice').textContent = data.product.listPrice || '';
                        document.getElementById('d-floorPrice').textContent = data.product.floorPrice || '';
                        document.getElementById('d-costPrice').textContent = data.product.costPrice || '';
                        document.getElementById('d-status').textContent = data.product.status || '';
                    } else {
                        throw new Error('Data format incorrect');
                    }
                })
                .catch(err => {
                    const msg = document.getElementById('detailMessage');
                    msg.textContent = 'Không thể tải chi tiết sản phẩm.';
                    msg.style.display = 'block';
                });
        }
    </script>
</body>
</html>
