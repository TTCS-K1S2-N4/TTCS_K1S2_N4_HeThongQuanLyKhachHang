<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập | CRM</title>

    <!-- Foundation -->
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">

    <!-- Auth module -->
    <link rel="stylesheet" href="../../assets/css/modules/auth.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- Header -->
            <div class="auth-header">
                <h1>Đăng nhập</h1>

                <p>
                    Đăng nhập để truy cập hệ thống quản lý khách hàng.
                </p>
            </div>

            <!-- Login form -->
            <form class="auth-form" action="#" method="post">

                <!-- Username -->
                <div class="form-group">
                    <label for="username">
                        Tên đăng nhập
                    </label>

                    <input id="username" name="username" class="form-control" type="text"
                        placeholder="Nhập tên đăng nhập" autocomplete="username" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">
                        Mật khẩu
                    </label>

                    <input id="password" name="password" class="form-control" type="password"
                        placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                </div>

                <!-- Login options -->
                <div class="auth-options">

                    <label class="remember-option">
                        <input type="checkbox" name="rememberMe">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>

                    <a href="./forgot-password.html" class="auth-link">
                        Quên mật khẩu?
                    </a>

                </div>

                <!-- Submit -->
                <button class="btn btn-primary" type="submit">
                    Đăng nhập
                </button>

            </form>

        </section>

    </main>

</body>

</html>
