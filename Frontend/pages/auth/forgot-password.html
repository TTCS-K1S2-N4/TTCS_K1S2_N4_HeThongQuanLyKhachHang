<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quên mật khẩu | CRM</title>

    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/auth.css">
</head>

<body>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-header">
                <h1>Quên mật khẩu?</h1>

                <p>
                    Nhập email đã đăng ký để gửi yêu cầu
                    khôi phục mật khẩu.
                </p>
            </div>

            <form class="auth-form" action="#" method="post">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input id="email" name="email" class="form-control" type="email" placeholder="example@company.com"
                        autocomplete="email" required>
                </div>

                <button class="btn btn-primary" type="submit">
                    Gửi yêu cầu
                </button>

            </form>

            <div class="auth-footer">
                <a href="./login.html">
                    ← Quay lại đăng nhập
                </a>
            </div>

        </section>
    </main>

</body>

</html>
