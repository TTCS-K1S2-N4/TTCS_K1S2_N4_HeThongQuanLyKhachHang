<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đổi mật khẩu | CRM</title>

    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/modules/auth.css">
</head>

<body>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-header">
                <h1>Đổi mật khẩu</h1>

                <p>
                    Cập nhật mật khẩu để bảo vệ tài khoản của bạn.
                </p>
            </div>

            <form class="auth-form" action="#" method="post">

                <div class="form-group">
                    <label for="currentPassword">
                        Mật khẩu hiện tại
                    </label>

                    <input id="currentPassword" name="currentPassword" class="form-control" type="password"
                        autocomplete="current-password" required>
                </div>

                <div class="form-group">
                    <label for="newPassword">
                        Mật khẩu mới
                    </label>

                    <input id="newPassword" name="newPassword" class="form-control" type="password"
                        autocomplete="new-password" required>

                    <small class="form-text">
                        Sử dụng mật khẩu đủ mạnh và không dùng lại
                        mật khẩu cũ.
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Xác nhận mật khẩu mới
                    </label>

                    <input id="confirmPassword" name="confirmPassword" class="form-control" type="password"
                        autocomplete="new-password" required>
                </div>

                <button class="btn btn-primary" type="submit">
                    Đổi mật khẩu
                </button>

            </form>

            <div class="auth-footer">
                <a href="../../index.html">
                    ← Quay lại hệ thống
                </a>
            </div>

        </section>
    </main>

</body>

</html>
