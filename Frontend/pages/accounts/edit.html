<main class="main-content" data-permission="account.update">

    <div class="content-container">

        <nav class="breadcrumb" aria-label="Breadcrumb">

            <a href="../../index.html">
                Trang chủ
            </a>

            <span>/</span>

            <a href="list.html">
                Tài khoản
            </a>

            <span>/</span>

            <a href="detail.html">
                Chi tiết
            </a>

            <span>/</span>

            <span class="breadcrumb-current">
                Chỉnh sửa
            </span>

        </nav>


        <div class="page-header">

            <div>

                <h1 class="page-title">
                    Chỉnh sửa tài khoản
                </h1>

                <p class="page-description">
                    Cập nhật thông tin cơ bản của người dùng.
                </p>

            </div>

        </div>


        <section class="card account-form">

            <div class="card-header">

                <h2 class="card-title">
                    Thông tin tài khoản
                </h2>

            </div>


            <div class="card-body">

                <form action="#" method="post">


                    <div class="form-row">

                        <div class="form-group">

                            <label class="form-label" for="editFullName">

                                Họ và tên

                                <span class="form-required">*</span>

                            </label>

                            <input id="editFullName" name="fullName" class="form-control" type="text"
                                value="Nguyễn Văn An" required>

                        </div>


                        <div class="form-group">

                            <label class="form-label" for="editEmail">

                                Email

                                <span class="form-required">*</span>

                            </label>

                            <input id="editEmail" name="email" class="form-control" type="email"
                                value="an.nguyen@example.com" required>

                        </div>

                    </div>


                    <div class="form-group">

                        <label class="form-label" for="editUsername">

                            Tên đăng nhập

                        </label>

                        <input id="editUsername" class="form-control" type="text" value="nguyenvanan" disabled>

                        <div class="form-help">
                            Tên đăng nhập không được thay đổi tại đây.
                        </div>

                    </div>


                    <div class="account-form-actions">

                        <a class="btn btn-secondary" href="detail.html">

                            Hủy

                        </a>

                        <button class="btn btn-primary" type="submit" data-permission="account.update">

                            Lưu thay đổi
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </div>

</main>
